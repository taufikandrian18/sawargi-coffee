# Paste inside the existing `server { ... }` block for website.taufikandrian.my.id
# (the one with `listen 443 ssl`), then:  sudo nginx -t && sudo systemctl reload nginx
# Match the port to HTTP_PORT and the path to BASE_PATH in deploy/.env.

location = /sawargi-coffee {
    return 301 /sawargi-coffee/;
}

location /sawargi-coffee/ {
    proxy_pass http://127.0.0.1:8088;          # no URI part: the full path is passed through
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 64m;                  # product photo uploads in WP admin
    proxy_read_timeout 120s;                   # plugin installs and WooCommerce updates
}
