# Sawargi on one VPS, under a path of a domain your existing web server already serves:
#   ${PUBLIC_URL}${BASE_PATH}/                → the React site (static files in ./site)
#   ${PUBLIC_URL}${BASE_PATH}/shop/           → WordPress + WooCommerce (checkout, payment plugins)
#   ${PUBLIC_URL}${BASE_PATH}/shop/wp-admin/  → WP admin (${BASE_PATH}/wp-admin redirects here)
# Your host web server (nginx/Apache) keeps ports 80/443 and HTTPS, and forwards
# ${BASE_PATH} to this stack on 127.0.0.1:${HTTP_PORT}. See docs/cms/WORDPRESS.md.

name: sawargi

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      # Localhost only: the host web server is the public entrance.
      - "127.0.0.1:${HTTP_PORT:-8088}:80"
    environment:
      BASE_PATH: ${BASE_PATH:?set BASE_PATH in deploy/.env, e.g. /sawargi-coffee}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      # WordPress lives at the same path on disk as in the URL, so PHP sees ordinary subfolder paths.
      - wp_data:/srv/wp${BASE_PATH}/shop:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - wordpress

  wordpress:
    image: wordpress:php8.3-fpm   # current WordPress; WooCommerce requires recent WP majors
    restart: unless-stopped
    # The image installs WordPress into its working directory on first start.
    working_dir: /srv/wp${BASE_PATH}/shop
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-sawargi}
      WORDPRESS_DB_USER: ${DB_USER:-sawargi}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      # The image's wp-config already trusts X-Forwarded-Proto: https from the proxy chain.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${PUBLIC_URL:?set PUBLIC_URL in deploy/.env}${BASE_PATH}/shop');
        define('WP_SITEURL', '${PUBLIC_URL}${BASE_PATH}/shop');
        define('SAWARGI_FRONTEND_ORIGIN', '${PUBLIC_URL}');
        define('SAWARGI_FRONTEND_URL', '${PUBLIC_URL}${BASE_PATH}/');
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp_data:/srv/wp${BASE_PATH}/shop
      - ../wordpress/mu-plugins/sawargi-headless.php:/srv/wp${BASE_PATH}/shop/wp-content/mu-plugins/sawargi-headless.php:ro
      - ./php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - db

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-sawargi}
      MARIADB_USER: ${DB_USER:-sawargi}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in deploy/.env}
    volumes:
      - db_data:/var/lib/mysql
    # No ports: the database is only reachable from the wordpress container.

  # One-off WP-CLI runs: docker compose run --rm wpcli wp plugin list
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    working_dir: /srv/wp${BASE_PATH}/shop
    environment:
      # www-data has no writable home; give WP-CLI one for its download cache.
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-sawargi}
      WORDPRESS_DB_USER: ${DB_USER:-sawargi}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${PUBLIC_URL}${BASE_PATH}/shop');
        define('WP_SITEURL', '${PUBLIC_URL}${BASE_PATH}/shop');
    volumes:
      - wp_data:/srv/wp${BASE_PATH}/shop
      - ../wordpress/mu-plugins/sawargi-headless.php:/srv/wp${BASE_PATH}/shop/wp-content/mu-plugins/sawargi-headless.php:ro
    depends_on:
      - db

volumes:
  wp_data:
  db_data:
  caddy_data:
  caddy_config:
